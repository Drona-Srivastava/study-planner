<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><title>Study Planner</title></head>
<body><main id="app"><section id="login" class="card"><h1>Study Planner</h1><form id="login-form"><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button><p id="login-error" class="error"></p></form></section><section id="planner" hidden><header><div><h1>Study Planner</h1><p id="today"></p></div><div class="actions"><button id="notify">Enable notifications</button><button id="logout">Log out</button></div></header><nav><button class="tab active" data-tab="agenda">Agenda</button><button class="tab" data-tab="tasks">Tasks</button></nav><section id="agenda" class="view"><div id="agenda-list"></div></section><section id="tasks" class="view" hidden><form id="task-form"><input id="task-title" placeholder="Add a task, e.g. Revise graphs @17/09/26 @@20:00" required><button>Add</button></form><div id="task-list"></div></section><p id="status"></p></section></main><script src="/config.js"></script><script src="/app.js"></script></body></html>
